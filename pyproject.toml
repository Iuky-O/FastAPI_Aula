[project]
name = "teste-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "Iuky.O",email = "iumyfarias03@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)"
]

[tool.poetry]
packages = [{include = "teste_poetry", from = "src"}]


[tool.poetry.group.dev.dependencies]
ruff = "^0.11.5"
taskipy = "^1.14.1"


[tool.poetry.group.pytest.dependencies]
pytest-cov = "^6.1.1"


[tool.pytest.ini_options]
pythonpath =["."]
addopts = '-p no:warnings'

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']


[tool.taskipy.tasks]
run = 'fastapi dev src/teste_poetry/app.py'
test = 'poetry run pytest'


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
